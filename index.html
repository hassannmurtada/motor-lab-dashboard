<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2G01 Motor Lab | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- THEME: MIDNIGHT PRO --- */
        :root {
            --bg-dark: #0a0a0c;
            --card-glass: rgba(30, 30, 35, 0.7);
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8b8b93;
            --accent-cyan: #00d2ff;
            --accent-purple: #bf5af2;
            --accent-red: #ff453a;
            --accent-green: #30d158;
            --accent-amber: #ffd60a;
            --font-stack: "SF Mono", "Menlo", "Roboto Mono", monospace;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 210, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(191, 90, 242, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100%; max-width: 1600px; margin: 0 auto; width: 100%; }
        .sidebar { width: 320px; background: rgba(10, 10, 12, 0.5); border-right: var(--border); padding: 30px; display: flex; flex-direction: column; backdrop-filter: blur(20px); z-index: 10; }
        .brand { font-family: var(--font-stack); font-size: 0.9rem; letter-spacing: 1px; color: var(--accent-cyan); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .control-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: var(--border); }
        .main-stage { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        
        /* Buttons */
        .btn-mode {
            width: 100%; padding: 12px; margin-top: 10px;
            background: rgba(255,255,255,0.05); border: var(--border);
            color: var(--text-sub); border-radius: 8px; cursor: pointer;
            font-family: var(--font-stack); font-size: 0.75rem;
            transition: all 0.2s; text-align: left; display: flex; justify-content: space-between;
        }
        .btn-mode:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-mode.active { background: rgba(0, 210, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* Chart & Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 24px; transition: transform 0.2s; }
        .metric-label { font-family: var(--font-stack); font-size: 0.75rem; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; }
        .metric-val { font-size: 2.5rem; font-weight: 600; margin-top: 8px; letter-spacing: -1px; }
        .metric-unit { font-size: 1rem; color: var(--text-sub); font-weight: 400; margin-left: 4px; }
        
        .chart-wrapper { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 25px; height: 350px; position: relative; margin-bottom: 30px; }

        /* Edu Panel */
        .edu-panel { background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid var(--accent-cyan); border-radius: 20px; padding: 30px; position: relative; transition: all 0.5s ease; border-left: 4px solid var(--accent-cyan); }
        .edu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .edu-title { font-size: 1.2rem; font-weight: 600; color: var(--accent-cyan); }
        .edu-badge { background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; font-family: var(--font-stack); }
        .formula-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; font-family: var(--font-stack); font-size: 0.9rem; color: var(--accent-purple); display: none; }

        /* Utilities */
        h1 { margin: 0; font-weight: 500; font-size: 2.2rem; letter-spacing: -0.5px; }
        header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
        .live-indicator { font-family: var(--font-stack); font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--text-sub); }
        .pulse.active { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        
        @media (max-width: 850px) {
            .app-container { flex-direction: column; }
            .sidebar { width: auto; height: auto; }
            .metrics-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <nav class="sidebar">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>P2G01 PRO</span>
            </div>

            <div class="control-panel">
                <div style="font-size: 0.8rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Operating Modes</div>
                
                <button class="btn-mode active" id="btn-0" onclick="setMode(0)">
                    <span>MANUAL / STOP</span> <span style="opacity:0.5">●</span>
                </button>
                
                <button class="btn-mode" id="btn-1" onclick="setMode(1)">
                    <span>PATTERN A: INTERVAL</span> <span style="opacity:0.5">A</span>
                </button>
                
                <button class="btn-mode" id="btn-2" onclick="setMode(2)">
                    <span>PATTERN B: RAMP</span> <span style="opacity:0.5">B</span>
                </button>
            </div>
            
            <div class="control-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size: 0.9rem; color: #fff;">Physics Details</span>
                    <input type="checkbox" id="physics-toggle" onchange="togglePhysics()">
                </div>
            </div>
            
            <div style="margin-top: auto; font-size: 0.75rem; color: var(--text-sub); font-family: var(--font-stack);">
                STATUS: <span id="mode-text">IDLE</span>
            </div>
        </nav>

        <main class="main-stage">
            <header>
                <div>
                    <h1>System Telemetry</h1>
                    <p style="color: var(--text-sub); margin-top: 5px;">Real-time electromechanical analysis.</p>
                </div>
                <div class="live-indicator">
                    <span id="status-text">OFFLINE</span>
                    <div class="pulse" id="status-dot"></div>
                </div>
            </header>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Voltage</div>
                    <div class="metric-val"><span id="val-v">0.00</span><span class="metric-unit">V</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Current</div>
                    <div class="metric-val"><span id="val-i">0.00</span><span class="metric-unit">A</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">RPM</div>
                    <div class="metric-val"><span id="val-rpm">0</span><span class="metric-unit">RPM</span></div>
                </div>
                <div class="metric-card" style="border-color: rgba(191, 90, 242, 0.3);">
                    <div class="metric-label" style="color: var(--accent-purple)">Power</div>
                    <div class="metric-val" style="color: var(--accent-purple)"><span id="val-p">0.00</span><span class="metric-unit">W</span></div>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>

            <div class="edu-panel" id="edu-panel">
                <div class="edu-header">
                    <div class="edu-title" id="edu-title">System Standby</div>
                    <div class="edu-badge" id="edu-badge">IDLE</div>
                </div>
                <div class="edu-content" id="edu-msg">Waiting for ESP32 connection...</div>
                <div class="formula-box" id="formula-box"></div>
            </div>
        </main>
    </div>

    <script>
        // REPLACE WITH YOUR BLYNK AUTH TOKEN
        const AUTH = "iagxsAFxs8gDX9dFuZIRFeXNTA9XQKGV"; 
        const REGION = "blynk.cloud";
        
        // V0=Voltage, V1=Current, V2=RPM, V3=Heartbeat, V4=CurrentModeIndex
        const PINS = `&V0&V1&V2&V3&V4`; 

        let chartInstance;
        let lastHeartbeatTime = 0;
        let showPhysics = false;

        window.onload = function() {
            initChart();
            setInterval(fetchData, 1000); 
            setInterval(checkHeartbeat, 2000); 
        };

        // --- CONTROL LOGIC ---
        async function setMode(modeIndex) {
            // Update UI immediately
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${modeIndex}`).classList.add('active');
            
            // Send to ESP32 via Pin V10 (Command Pin)
            try {
                await fetch(`https://${REGION}/external/api/update?token=${AUTH}&V10=${modeIndex}`);
                console.log("Mode Set to:", modeIndex);
            } catch (e) { console.error("Failed to set mode"); }
        }

        // --- DATA LOGIC ---
        async function fetchData() {
            try {
                const response = await fetch(`https://${REGION}/external/api/get?token=${AUTH}${PINS}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const v = parseFloat(data.V0) || 0;
                const i = parseFloat(data.V1) || 0;
                const rpm = parseFloat(data.V2) || 0;
                const heartbeat = parseInt(data.V3) || 0;
                const serverMode = parseInt(data.V4) || 0;

                lastHeartbeatTime = Date.now();
                updateUI(true, v, i, rpm, serverMode);

            } catch (e) { console.log("Conn Error"); }
        }

        function checkHeartbeat() {
            if (Date.now() - lastHeartbeatTime > 3500) updateUI(false);
        }

        function updateUI(online, v=0, i=0, rpm=0, mode=0) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const modeTxt = document.getElementById('mode-text');
            const p = v * i;

            if (online) {
                dot.className = "pulse active";
                txt.innerText = "LIVE";
                txt.style.color = "#30d158";

                // Sync Mode Button if changed by ESP
                document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
                if(document.getElementById(`btn-${mode}`)) 
                    document.getElementById(`btn-${mode}`).classList.add('active');

                // Update Values
                document.getElementById('val-v').innerText = v.toFixed(2);
                document.getElementById('val-i').innerText = i.toFixed(2);
                document.getElementById('val-rpm').innerText = rpm.toFixed(0);
                document.getElementById('val-p').innerText = p.toFixed(2);

                // Chart
                const now = new Date().toLocaleTimeString();
                chartInstance.data.labels.push(now);
                chartInstance.data.datasets[0].data.push(rpm);
                if (chartInstance.data.labels.length > 20) {
                    chartInstance.data.labels.shift();
                    chartInstance.data.datasets[0].data.shift();
                }
                chartInstance.update();
                
                analyzePhysics(v, i, rpm, p, mode);
            } else {
                dot.className = "pulse";
                txt.innerText = "OFFLINE";
                txt.style.color = "#ff453a";
            }
        }

        function analyzePhysics(v, i, rpm, p, mode) {
            const panel = document.getElementById('edu-panel');
            const formulaBox = document.getElementById('formula-box');
            formulaBox.style.display = document.getElementById('physics-toggle').checked ? 'block' : 'none';

            let title = "System Idle";
            let msg = "Motor is stationary.";
            let color = "#8b8b93";

            if (mode === 1) {
                title = "Pattern A: Interval Training";
                msg = "Executing High-Load / Low-Load cycle. Notice how Current (I) spikes when RPM accelerates (Torque generation), and drops during 'Chill' phases.";
                color = "#bf5af2"; // Purple
                formulaBox.innerHTML = "Cycle: Max &rarr; Rest &rarr; Mid &rarr; Rest";
            } else if (mode === 2) {
                title = "Pattern B: Linear Ramp";
                msg = "Gradually increasing voltage. Observe the linear relationship between Voltage (V) and RPM. Back-EMF increases proportionally with speed.";
                color = "#00d2ff"; // Cyan
                formulaBox.innerHTML = "V_terminal &prop; RPM";
            } else if (v > 1) {
                title = "Manual Operation";
                msg = `Motor running at constant velocity. Input Power is ${p.toFixed(1)}W.`;
                color = "#30d158";
            }

            document.getElementById('edu-title').innerText = title;
            document.getElementById('edu-title').style.color = color;
            document.getElementById('edu-msg').innerHTML = msg;
            panel.style.borderLeftColor = color;
            document.getElementById('edu-badge').innerText = `MODE ${mode}`;
            document.getElementById('edu-badge').style.color = color;
            document.getElementById('edu-badge').style.background = color + "20";
        }

        function togglePhysics() {
            // Refreshes view next cycle
        }

        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(191, 90, 242, 0.2)');
            gradient.addColorStop(1, 'rgba(191, 90, 242, 0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'RPM',
                        data: [],
                        borderColor: '#bf5af2',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b8b93' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
