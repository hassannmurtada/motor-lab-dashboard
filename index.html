<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2G01 Motor Lab | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- THEME: MIDNIGHT PRO --- */
        :root {
            --bg-dark: #0a0a0c;
            --card-glass: rgba(30, 30, 35, 0.7);
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8b8b93;
            --accent-cyan: #00d2ff;
            --accent-purple: #bf5af2;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --font-stack: "SF Mono", "Menlo", monospace;
        }

        body {
            margin: 0; background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .app-container { display: flex; height: 100%; max-width: 1600px; margin: 0 auto; width: 100%; }
        .sidebar { width: 320px; background: rgba(10, 10, 12, 0.5); border-right: var(--border); padding: 30px; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; gap: 20px;}
        .main-stage { flex: 1; padding: 40px; overflow-y: auto; }
        
        .control-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; border: var(--border); }
        .panel-header { font-size: 0.8rem; color: #fff; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }

        /* Buttons */
        .btn-mode {
            width: 100%; padding: 12px; margin-top: 10px;
            background: rgba(255,255,255,0.05); border: var(--border);
            color: var(--text-sub); border-radius: 8px; cursor: pointer;
            font-family: var(--font-stack); font-size: 0.75rem;
            transition: all 0.2s; display: flex; justify-content: space-between;
        }
        .btn-mode:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-mode.active { background: rgba(0, 210, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* Slider */
        .slider-container { margin-top: 15px; display: none; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .slider-container.show { display: block; }
        input[type=range] { width: 100%; accent-color: var(--accent-cyan); cursor: pointer; }

        /* Specs List */
        .specs-list { font-family: var(--font-stack); font-size: 0.75rem; color: var(--text-sub); display: flex; flex-direction: column; gap: 8px; }
        .spec-item { display: flex; justify-content: space-between; }
        .spec-val { color: var(--accent-purple); }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 24px; position: relative; overflow: hidden; }
        
        /* Special highlight for Torque */
        .metric-card.highlight { border-color: rgba(255, 159, 10, 0.3); background: rgba(255, 159, 10, 0.05); }
        .metric-card.highlight .metric-val { color: var(--accent-orange); }

        .metric-val { font-size: 2.5rem; font-weight: 600; margin-top: 8px; }
        .metric-unit { font-size: 1rem; color: var(--text-sub); margin-left: 5px; }
        
        .chart-wrapper { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 25px; height: 350px; position: relative; }
        
        /* Status */
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; }
        .pulse.active { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        @media (max-width: 850px) { .app-container { flex-direction: column; } .sidebar { width: auto; height: auto; } }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <h3 style="color:var(--accent-cyan); margin:0 0 10px 0;">P2G01 PRO</h3>

            <div class="control-panel">
                <div class="panel-header">Drive Mode</div>
                
                <button class="btn-mode active" id="btn-0" onclick="setMode(0)">
                    <span>MANUAL CONTROL</span> <span>●</span>
                </button>
                
                <div class="slider-container" id="manual-slider-box">
                    <div style="font-size:0.7rem; color:var(--text-sub); margin-bottom:5px; display:flex; justify-content:space-between;">
                        <span>DUTY CYCLE</span> <span id="slider-val" style="color:#fff">0%</span>
                    </div>
                    <input type="range" min="0" max="255" value="0" oninput="updateSpeedLabel(this.value)" onchange="sendSpeed(this.value)">
                </div>

                <button class="btn-mode" id="btn-1" onclick="setMode(1)">
                    <span>PATTERN A: INTERVAL</span> <span>A</span>
                </button>
                
                <button class="btn-mode" id="btn-2" onclick="setMode(2)">
                    <span>PATTERN B: RAMP</span> <span>B</span>
                </button>
            </div>
            
            <div class="control-panel">
                <div class="panel-header">Specifications</div>
                <div class="specs-list">
                    <div class="spec-item"><span>Motor</span> <span class="spec-val">DC Brushed</span></div>
                    <div class="spec-item"><span>Driver</span> <span class="spec-val">MOSFET (LS)</span></div>
                    <div class="spec-item"><span>Logic</span> <span class="spec-val">3.3V TTL</span></div>
                    <div class="spec-item"><span>RPM Method</span> <span class="spec-val">Back-EMF</span></div>
                    <div class="spec-item"><span>Max Torque</span> <span class="spec-val">35 mNm</span></div>
                </div>
            </div>

            <div style="margin-top:auto; font-size:0.75rem; color:var(--text-sub);">
                SYSTEM STATUS: <span id="status-text">OFFLINE</span>
            </div>
        </nav>

        <main class="main-stage">
            <header style="display:flex; justify-content:space-between; margin-bottom:40px;">
                <h1>System Telemetry</h1>
                <div class="live-indicator"><div class="pulse" id="status-dot"></div> LIVE DATA</div>
            </header>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div style="color:var(--text-sub); font-size:0.75rem;">TERMINAL VOLTAGE</div>
                    <div class="metric-val"><span id="val-v">0.0</span><span class="metric-unit">V</span></div>
                </div>
                <div class="metric-card">
                    <div style="color:var(--text-sub); font-size:0.75rem;">CURRENT DRAW</div>
                    <div class="metric-val"><span id="val-i">0.00</span><span class="metric-unit">A</span></div>
                </div>
                <div class="metric-card highlight">
                    <div style="color:var(--text-sub); font-size:0.75rem;">TORQUE OUTPUT</div>
                    <div class="metric-val"><span id="val-t">0</span><span class="metric-unit">mNm</span></div>
                </div>
                <div class="metric-card">
                    <div style="color:var(--text-sub); font-size:0.75rem;">ANGULAR SPEED</div>
                    <div class="metric-val"><span id="val-rpm">0</span><span class="metric-unit">RPM</span></div>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        const AUTH = "iagxsAFxs8gDX9dFuZIRFeXNTA9XQKGV"; 
        const REGION = "blynk.cloud";
        // We fetch V6 explicitly here
        const PINS = `&V0&V1&V2&V4&V6`; 

        let chartInstance;
        let lastUserAction = 0;

        window.onload = function() {
            initChart();
            setInterval(fetchData, 1000); 
            document.getElementById('manual-slider-box').classList.add('show');
        };

        // 1. CONTROL FUNCTIONS
        async function setMode(modeIndex) {
            lastUserAction = Date.now(); // Interaction Lock

            // UI Update Immediately
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${modeIndex}`).classList.add('active');
            
            const sliderBox = document.getElementById('manual-slider-box');
            if(modeIndex === 0) sliderBox.classList.add('show');
            else sliderBox.classList.remove('show');

            // CRITICAL FIX: Sending to V4 (Mode Pin) instead of V10
            // This prevents the "switch back" glitch
            fetch(`https://${REGION}/external/api/update?token=${AUTH}&V4=${modeIndex}`);
        }

        function updateSpeedLabel(val) {
            let pct = Math.round((val / 255) * 100);
            document.getElementById('slider-val').innerText = pct + "%";
        }

        async function sendSpeed(val) {
            lastUserAction = Date.now(); 
            fetch(`https://${REGION}/external/api/update?token=${AUTH}&V5=${val}`);
        }

        // 2. DATA SYNC LOOP
        async function fetchData() {
            try {
                // Fetch V0(V), V1(A), V2(RPM), V4(Mode), V6(Torque)
                const response = await fetch(`https://${REGION}/external/api/get?token=${AUTH}${PINS}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const v = parseFloat(data.V0) || 0;
                const i = parseFloat(data.V1) || 0;
                const rpm = parseFloat(data.V2) || 0;
                const torque = parseFloat(data.V6) || 0;
                const mode = parseInt(data.V4) || 0;

                // Update Metrics
                document.getElementById('val-v').innerText = v.toFixed(1);
                document.getElementById('val-i').innerText = i.toFixed(2);
                document.getElementById('val-rpm').innerText = rpm.toFixed(0);
                document.getElementById('val-t').innerText = torque.toFixed(0);

                // Update Status
                document.getElementById('status-dot').className = "pulse active";
                document.getElementById('status-text').innerText = "ONLINE";

                // Update Chart
                const now = new Date().toLocaleTimeString();
                chartInstance.data.labels.push(now);
                chartInstance.data.datasets[0].data.push(rpm);
                if (chartInstance.data.labels.length > 20) {
                    chartInstance.data.labels.shift();
                    chartInstance.data.datasets[0].data.shift();
                }
                chartInstance.update();

                // 3. CONTROL SYNC (CONDITIONAL)
                // Only sync buttons if user hasn't clicked recently (3s cooldown)
                if (Date.now() - lastUserAction > 3000) {
                    document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
                    if(document.getElementById(`btn-${mode}`)) {
                        document.getElementById(`btn-${mode}`).classList.add('active');
                        
                        const sliderBox = document.getElementById('manual-slider-box');
                        if(mode === 0) sliderBox.classList.add('show');
                        else sliderBox.classList.remove('show');
                    }
                }

            } catch (e) { 
                document.getElementById('status-dot').className = "pulse";
                document.getElementById('status-text').innerText = "OFFLINE";
            }
        }

        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(0, 210, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 210, 255, 0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'RPM',
                        data: [],
                        borderColor: '#00d2ff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b8b93' } }
                    },
                    animation: false
                }
            });
        }
    </script>
</body>
</html>
