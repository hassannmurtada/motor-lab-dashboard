<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2G01 Motor Lab | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- THEME: MIDNIGHT PRO --- */
        :root {
            --bg-dark: #0a0a0c;
            --card-glass: rgba(30, 30, 35, 0.7);
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #8b8b93;
            --accent-cyan: #00d2ff;
            --accent-purple: #bf5af2;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --font-stack: "SF Mono", "Menlo", monospace;
        }

        body {
            margin: 0; background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .app-container { display: flex; height: 100%; max-width: 1600px; margin: 0 auto; width: 100%; }
        .sidebar { width: 320px; background: rgba(10, 10, 12, 0.5); border-right: var(--border); padding: 30px; display: flex; flex-direction: column; z-index: 10; }
        .main-stage { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .control-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: var(--border); }
        
        /* Buttons */
        .btn-mode {
            width: 100%; padding: 12px; margin-top: 10px;
            background: rgba(255,255,255,0.05); border: var(--border);
            color: var(--text-sub); border-radius: 8px; cursor: pointer;
            font-family: var(--font-stack); font-size: 0.75rem;
            transition: all 0.2s; display: flex; justify-content: space-between;
        }
        .btn-mode:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-mode.active { background: rgba(0, 210, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* Slider */
        .slider-container { margin-top: 15px; display: none; }
        .slider-container.show { display: block; }
        input[type=range] { width: 100%; accent-color: var(--accent-cyan); }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 24px; }
        .metric-val { font-size: 2.2rem; font-weight: 600; margin-top: 8px; }
        .metric-unit { font-size: 0.9rem; color: var(--text-sub); margin-left:5px;}
        
        .chart-wrapper { background: var(--card-glass); border: var(--border); border-radius: 20px; padding: 25px; height: 300px; position: relative; margin-bottom: 30px;}
        
        /* EDU PANEL (PHYSICS NOTES) */
        .edu-panel { 
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%); 
            border: 1px solid var(--accent-cyan); 
            border-left: 4px solid var(--accent-cyan);
            border-radius: 16px; padding: 25px; 
            margin-top: auto; /* Pushes to bottom */
            transition: all 0.5s ease;
        }
        .edu-title { font-size: 1.1rem; font-weight: 600; color: var(--accent-cyan); margin-bottom: 10px; display:flex; justify-content:space-between;}
        .edu-badge { font-size: 0.7rem; background: rgba(0, 210, 255, 0.2); padding: 4px 8px; border-radius: 4px; }
        .edu-content { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; }

        /* Status */
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; }
        .pulse.active { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        @media (max-width: 850px) { .app-container { flex-direction: column; } .sidebar { width: auto; } }
    </style>
</head>

    <div class="app-container">
        <nav class="sidebar">
            <h3 style="color:var(--accent-cyan); margin:0 0 30px 0;">P2G01 PRO</h3>

            <div class="control-panel">
                <div style="font-size: 0.8rem; color: #fff; text-transform: uppercase;">Control Mode</div>
                
                <button class="btn-mode active" id="btn-0" onclick="setMode(0)">
                    <span>MANUAL</span> <span>●</span>
                </button>
                
                <div class="slider-container" id="manual-slider-box">
                    <div style="font-size:0.7rem; color:var(--text-sub); margin-bottom:5px; display:flex; justify-content:space-between;">
                        <span>PWM DUTY</span> <span id="slider-val">0%</span>
                    </div>
                    <input type="range" min="0" max="255" value="0" oninput="updateSpeed(this.value)" onchange="sendSpeed(this.value)">
                </div>

                <button class="btn-mode" id="btn-1" onclick="setMode(1)">
                    <span>INTERVAL</span> <span>A</span>
                </button>
                
                <button class="btn-mode" id="btn-2" onclick="setMode(2)">
                    <span>RAMP / SINE</span> <span>B</span>
                </button>
            </div>
            
            <div style="margin-top:auto; font-size:0.75rem; color:var(--text-sub);">
                LINK: <span id="status-text">CONNECTING...</span>
            </div>
        </nav>

            <header style="display:flex; justify-content:space-between; margin-bottom:30px;">
                <h1>Motor Lab Telemetry</h1>
                <div class="live-indicator"><div class="pulse" id="status-dot"></div> LIVE</div>
            </header>
