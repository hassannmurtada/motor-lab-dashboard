<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Lab P2G01 | Dashboard</title>
    <style>
        /* --- VARIABLES & THEME --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --sidebar-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --accent-red: #ff3b30;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: #fbfbfd;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* Prevent full page scroll, scroll content instead */
            display: flex;
        }

        /* --- ANIMATED BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(216, 235, 255, 1) 0%, rgba(255, 255, 255, 0) 40%),
                        radial-gradient(circle at 90% 80%, rgba(225, 215, 255, 1) 0%, rgba(255, 255, 255, 0) 40%);
            animation: moveGradient 15s ease infinite alternate;
        }

        @keyframes moveGradient {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: var(--glass-border);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            color: var(--text-main);
        }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item.active {
            background: #fff;
            color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
        }

        .nav-item:hover:not(.active) {
            background: rgba(0,0,0,0.03);
            color: var(--text-main);
        }

        .sidebar-footer {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            padding: 40px 50px;
            overflow-y: auto;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 600;
        }
        
        .page-title p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
        }

        .status-badge {
            background: rgba(255,255,255,0.8);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            border: var(--glass-border);
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .dot.online { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* --- DASHBOARD GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 25px;
            border: var(--glass-border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            background: rgba(255,255,255,0.75);
        }

        /* Icons */
        .card-icon {
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .icon-blue { background: rgba(0, 122, 255, 0.1); color: var(--accent-blue); }
        .icon-orange { background: rgba(255, 149, 0, 0.1); color: var(--accent-orange); }
        .icon-purple { background: rgba(175, 82, 222, 0.1); color: #AF52DE; }
        .icon-green { background: rgba(52, 199, 89, 0.1); color: var(--accent-green); }

        .card-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 5px 0 0 0;
            color: var(--text-main);
        }

        .card-unit {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-left: 4px;
        }

        /* --- FEEDBACK SECTION --- */
        .feedback-section {
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .feedback-indicator {
            width: 4px;
            align-self: stretch;
            background: var(--text-muted);
            border-radius: 4px;
            transition: background 0.3s;
        }

        .feedback-content h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .feedback-content p {
            margin: 0;
            line-height: 1.6;
            color: var(--text-muted);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: auto; padding: 20px; flex-direction: row; align-items: center; }
            .sidebar-footer { display: none; }
            .main-content { padding: 20px; }
            .page-title h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <nav class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            P2G01 Kit
        </div>
        
        <div class="nav-links">
            <div class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </div>
            <div class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Data Logs
            </div>
            <div class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </div>
        </div>

        <div class="sidebar-footer">
            v1.0.4 Beta<br>Connected to Blynk
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div class="page-title">
                <h1>Overview</h1>
                <p>Real-time motor analysis and diagnostics.</p>
            </div>
            <div class="status-badge">
                <div class="dot" id="connection-dot"></div>
                <span id="connection-text">Connecting...</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-icon icon-orange">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </div>
                <div class="card-label">Voltage</div>
                <div class="card-value"><span id="val-voltage">--</span><span class="card-unit">V</span></div>
            </div>

            <div class="card">
                <div class="card-icon icon-blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                </div>
                <div class="card-label">Current</div>
                <div class="card-value"><span id="val-current">--</span><span class="card-unit">A</span></div>
            </div>

            <div class="card">
                <div class="card-icon icon-purple">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12c0-5.5 4.5-10 10-10 2.8 0 5.3 1.1 7.1 2.9M22 12c0 5.5-4.5 10-10 10-2.8 0-5.3-1.1-7.1-2.9"></path></svg>
                </div>
                <div class="card-label">RPM</div>
                <div class="card-value"><span id="val-rpm">--</span><span class="card-unit">RPM</span></div>
            </div>

            <div class="card">
                <div class="card-icon icon-green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                </div>
                <div class="card-label">Power</div>
                <div class="card-value"><span id="val-power">--</span><span class="card-unit">W</span></div>
            </div>
        </div>

        <div class="feedback-section">
            <div class="feedback-indicator" id="feedback-bar"></div>
            <div class="feedback-content">
                <h3 id="feedback-title">System Diagnostics</h3>
                <p id="feedback-message">Waiting for sensor data stream from ESP32...</p>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION (Hassan's Credentials)
        // ==========================================
        const BLYNK_AUTH = "iagxsAFxs8gDX9dFuZIRFeXNTA9XQKGV"; 
        const BLYNK_REGION = "blynk.cloud"; 
        const PIN_VOLTAGE = "V0"; 
        const PIN_CURRENT = "V1"; 
        const PIN_RPM = "V2";
        // ==========================================

        const indicatorBar = document.getElementById('feedback-bar');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackMsg = document.getElementById('feedback-message');
        const connDot = document.getElementById('connection-dot');
        const connText = document.getElementById('connection-text');

        async function fetchBlynkData() {
            try {
                // Fetch data from Blynk Cloud API
                const [vRes, iRes, rpmRes] = await Promise.all([
                    fetch(`https://${BLYNK_REGION}/external/api/get?token=${BLYNK_AUTH}&${PIN_VOLTAGE}`),
                    fetch(`https://${BLYNK_REGION}/external/api/get?token=${BLYNK_AUTH}&${PIN_CURRENT}`),
                    fetch(`https://${BLYNK_REGION}/external/api/get?token=${BLYNK_AUTH}&${PIN_RPM}`)
                ]);

                if (!vRes.ok) throw new Error("API Limit or Network Error");

                const voltage = parseFloat(await vRes.text()) || 0;
                const current = parseFloat(await iRes.text()) || 0;
                const rpm = parseFloat(await rpmRes.text()) || 0;

                updateUI(voltage, current, rpm);
                setOnlineStatus(true);

            } catch (error) {
                console.error(error);
                setOnlineStatus(false);
            }
        }

        function setOnlineStatus(isOnline) {
            if(isOnline) {
                connDot.classList.add('online');
                connText.innerText = "Live";
                connText.style.color = "#34c759";
            } else {
                connDot.classList.remove('online');
                connText.innerText = "Offline";
                connText.style.color = "#86868b";
            }
        }

        function updateUI(v, i, rpm) {
            document.getElementById('val-voltage').innerText = v.toFixed(2);
            document.getElementById('val-current').innerText = i.toFixed(2);
            document.getElementById('val-rpm').innerText = rpm.toFixed(0);
            
            const power = v * i;
            document.getElementById('val-power').innerText = power.toFixed(2);

            analyzeMotorPerformance(v, i, rpm, power);
        }

        function analyzeMotorPerformance(v, i, rpm, power) {
            // Logic derived from P2G01 Kit
            let statusColor = "#86868b"; // Default Gray
            let title = "System Idle";
            let msg = "Power supply disconnected.";

            if (v < 0.5) {
                statusColor = "#86868b";
                title = "System Offline";
                msg = "No input voltage detected. Please connect the power source.";
            } 
            else if (i > 1.5 && rpm < 50) {
                statusColor = "#ff3b30"; // Red
                title = "CRITICAL: Stall Detected";
                msg = "High current with no rotation. <strong>IMMEDIATE ACTION:</strong> Power off and check for mechanical blockage.";
            }
            else if (v > 4.0 && rpm === 0 && i < 0.5) {
                statusColor = "#ff9500"; // Orange
                title = "Startup Warning";
                msg = "Voltage is present but motor is not spinning. Check brush contact or friction.";
            }
            else if (rpm > 200 && i < 0.3) {
                statusColor = "#34c759"; // Green
                title = "High Efficiency Mode";
                msg = `Motor running freely with high Back-EMF. Power consumption is optimized at ${power.toFixed(2)}W.`;
            }
            else {
                statusColor = "#007aff"; // Blue
                title = "Nominal Operation";
                msg = `Motor is generating torque. Input Power: ${power.toFixed(2)}W.`;
            }

            // Apply Styles
            indicatorBar.style.background = statusColor;
            feedbackTitle.style.color = statusColor;
            feedbackTitle.innerHTML = title;
            feedbackMsg.innerHTML = msg;
        }

        // Poll every 1.5s
        setInterval(fetchBlynkData, 1500);
        fetchBlynkData();
    </script>
</body>
</html>
